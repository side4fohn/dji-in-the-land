name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      placeholder: 请描述你想要的功能，以及为什么需要它...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      placeholder: 有没有其他方式可以实现你的需求？

  - type: checkboxes
    id: priority
    attributes:
      label: 优先级
      options:
        - label: 高 - 影响日常使用
        - label: 中 - 改善体验
        - label: 低 - 锦上添花
