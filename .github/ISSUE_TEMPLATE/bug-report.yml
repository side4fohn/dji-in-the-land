name: Bug Report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug 描述
        请描述你遇到的 bug。

  - type: textarea
    id: description
    attributes:
      label: 详细描述
      placeholder: 请描述具体问题，包括操作步骤、期望结果、实际结果...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - iOS
        - iPad
        - Android
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS / iPadOS 版本
      placeholder: 例如 17.5

  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: 例如 1.0.0

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 控制台输出
      placeholder: 请粘贴相关错误日志...

  - type: checkboxes
    id: checklist
    attributes:
      label: 复现步骤
      options:
        - label: 我可以稳定复现此问题
        - label: 问题随机出现
        - label: 只出现一次
