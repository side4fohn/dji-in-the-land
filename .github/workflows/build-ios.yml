name: Build iOS IPA

on:
  push:
    branches: [main, ios]
  pull_request:
    branches: [main, ios]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.24.0'
        type: string
      dji_sdk_version:
        description: 'DJI SDK version'
        required: false
        default: '4.16.1'
        type: string

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.0' }}
  DJI_SDK_VERSION: ${{ inputs.dji_sdk_version || '4.16.1' }}

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Get Flutter dependencies
        run: |
          flutter pub get --no-precompile
          echo "=== pubspec.yaml AFTER pub get ==="
          head -3 pubspec.yaml

      - name: Generate iOS Xcode project
        run: |
          echo "=== CURRENT pubspec.yaml content ==="
          head -3 pubspec.yaml

          echo ""
          echo "=== Step 1: Backup custom files ==="
          mkdir -p /tmp/ios_backup
          if [ -d "ios/Runner" ]; then
            cp -r ios/Runner /tmp/ios_backup/
            echo "Backed up ios/Runner/"
          else
            echo "No ios/Runner/ to back up"
          fi
          if [ -f "ios/Podfile" ]; then
            cp ios/Podfile /tmp/ios_backup/
            echo "Backed up ios/Podfile"
          else
            echo "No ios/Podfile to back up"
          fi

          echo ""
          echo "=== Step 2: Regenerate iOS platform ==="
          rm -rf ios
          flutter create . --platforms=ios --org com.dji 2>&1

          echo ""
          echo "=== Step 3: Restore custom files ==="
          if [ -f "/tmp/ios_backup/Podfile" ]; then
            cp /tmp/ios_backup/Podfile ios/
            echo "Restored custom Podfile"
          fi
          if [ -d "/tmp/ios_backup/Runner" ]; then
            mkdir -p ios/Runner
            cp -r /tmp/ios_backup/Runner/* ios/Runner/
            echo "Restored custom Swift files to ios/Runner/"
            ls -la ios/Runner/
          fi

          echo ""
          echo "=== Step 4: Verify Xcode project ==="
          if [ -d "ios/Runner.xcodeproj" ]; then
            echo "SUCCESS: ios/Runner.xcodeproj found"
            ls -la ios/
          else
            echo "FAILURE: ios/Runner.xcodeproj NOT found"
            ls -la ios/
            exit 1
          fi

      - name: Diagnostic
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo ""
          echo "=== Flutter doctor ==="
          flutter doctor -v
          echo ""
          echo "=== Available simulators ==="
          xcrun simctl list devices available

      - name: Install iOS dependencies
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          cd ios
          pod install 2>&1 | tee ../pod_install.log
          cd ..

      - name: Build iOS Simulator
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          echo "::group::Build iOS Simulator"
          flutter build ios --simulator --no-codesign 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Flutter exit code: $EXIT_CODE ==="
          echo ""
          echo "=== Checking Runner.app ==="
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "Runner.app found! BUILD SUCCESS"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "Runner.app NOT found. BUILD FAILED"
            echo ""
            echo "=== build.log ==="
            cat build.log || echo "(no build.log)"
          fi
          echo "::endgroup::"

      - name: Upload build artifacts
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts-${{ github.run_number }}
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7

      - name: Upload logs on failure
        if: env.BUILD_SUCCESS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            pod_install.log
          retention-days: 7
