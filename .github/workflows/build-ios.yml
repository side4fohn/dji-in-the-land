name: Build iOS IPA

on:
  push:
    branches: [main, ios]
  pull_request:
    branches: [main, ios]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.24.0'
        type: string
      dji_sdk_version:
        description: 'DJI SDK version'
        required: false
        default: '4.16.1'
        type: string

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.0' }}
  DJI_SDK_VERSION: ${{ inputs.dji_sdk_version || '4.16.1' }}

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-osx-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/ios
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install iOS dependencies
        env:
          BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          cd ios
          pod install 2>&1 | tee ../pod_install.log
          cd ..

      - name: Build iOS Simulator
        env:
          BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter build ios --simulator --no-codesign 2>&1 | tee build.log
          echo "--- Build log ---"
          cat build.log
          echo "--- End build log ---"
          # Check if Runner.app exists
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "Artifact size: $(du -sh build/ios/iphonesimulator/Runner.app | cut -f1)"
          else
            echo "Runner.app not found in build/ios/iphonesimulator/"
            ls -la build/ios/ 2>/dev/null || echo "build/ios/ does not exist"
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Upload build artifacts
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts-${{ github.run_number }}
          path: |
            build/ios/iphonesimulator/Runner.app
            build/ios/iphonesimulator/Runner.app.dSYM
          retention-days: 7

      - name: Summary
        run: |
          if [ "$BUILD_SUCCESS" = "true" ]; then
            echo "## iOS Build: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
            echo "| DJI SDK | ${{ env.DJI_SDK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Artifact | `Runner.app` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## iOS Build: FAILED" >> $GITHUB_STEP_SUMMARY
            if [ -f build.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Build log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -80 build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
            exit 1
          fi

      - name: Upload logs on failure
        if: env.BUILD_SUCCESS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            pod_install.log
          retention-days: 7
