name: Build iOS IPA

on:
  push:
    branches: [main, ios]
  pull_request:
    branches: [main, ios]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.24.0'
        type: string
      dji_sdk_version:
        description: 'DJI SDK version'
        required: false
        default: '4.16.1'
        type: string

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.0' }}
  DJI_SDK_VERSION: ${{ inputs.dji_sdk_version || '4.16.1' }}

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-osx-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/ios
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Diagnostic
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo ""
          echo "=== Flutter doctor ==="
          flutter doctor -v
          echo ""
          echo "=== Available simulators ==="
          xcrun simctl list devices available
          echo ""
          echo "=== Checking repo ==="
          ls -la
          ls -la ios/ 2>/dev/null || echo "NO ios/ DIR"
          ls -la lib/ 2>/dev/null || echo "NO lib/ DIR"

      - name: Install iOS dependencies
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          cd ios
          pod install 2>&1 | tee ../pod_install.log
          cd ..

      - name: Build iOS Simulator
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          echo "=== Running flutter build ==="
          flutter build ios --simulator --no-codesign 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Flutter exit code: $EXIT_CODE"
          echo ""
          echo "=== build.log content ==="
          if [ -f build.log ]; then
            cat build.log
          else
            echo "(build.log not created)"
          fi
          echo ""
          echo "=== Checking Runner.app ==="
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "Runner.app found"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "Runner.app NOT found"
            echo ""
            echo "=== build/ directory ==="
            ls -la build/ 2>/dev/null || echo "(no build/)"
          fi

      - name: Upload build artifacts
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts-${{ github.run_number }}
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7

      - name: Upload logs on failure
        if: env.BUILD_SUCCESS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            pod_install.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## iOS Build: ${{ env.BUILD_SUCCESS == 'true' && 'SUCCESS' || 'FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | $(xcodebuild -version | head -1) |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $(sw_vers -productVersion) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build success | ${{ env.BUILD_SUCCESS }} |" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### build.log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(no build.log)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
